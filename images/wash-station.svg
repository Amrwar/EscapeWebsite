<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <rect width="800" height="1000" filter="url(#n)" opacity="0.5"/>
  <g fill="#5c5a54" font-family="Helvetica, Arial, sans-serif">
    <text x="400" y="490" font-size="20" letter-spacing="4" text-anchor="middle" text-transform="uppercase">PHOTO PLACEHOLDER</text>
    <text x="400" y="525" font-size="15" letter-spacing="2" text-anchor="middle" fill="#3f3d38">WASH STATION</text>
  </g>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#2a2a2a" stroke-width="1"/>
</svg>
